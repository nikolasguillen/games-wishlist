# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# 2048m was not enough to run KSP and R8 in the same invocation: the daemon died with a GC
# thrashing error. The metaspace cap keeps the Kotlin and KSP compilers from growing unbounded.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# 14 modules with no cross-dependencies at the leaves, so they build concurrently.
org.gradle.parallel=true

# Reuse task outputs across builds and between the CLI and the IDE.
org.gradle.caching=true

# Skips the configuration phase entirely when nothing in the build scripts changed.
org.gradle.configuration-cache=true

kotlin.code.style=official
android.disallowKotlinSourceSets=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
